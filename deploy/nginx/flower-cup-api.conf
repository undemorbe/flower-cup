# Вариант 1: сайт на GitHub Pages, на своём сервере только API.
#   https://undemorbe.github.io/flower-cup/  ->  https://api.example.ru/api/...
#
# Установка (Debian/Ubuntu):
#   sudo cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/flower-cup-api.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/flower-cup-api.conf /etc/nginx/sites-enabled/
#   замените api.example.ru, получите сертификат: sudo certbot --nginx -d api.example.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# В server/.env: TRUST_PROXY=1, ALLOWED_ORIGINS=https://undemorbe.github.io
# В GitHub: Settings -> Secrets and variables -> Actions -> Variables: API_URL=https://api.example.ru

upstream flower_cup_api {
    server 127.0.0.1:8787;
    keepalive 8;
}

# Вход в админку: не чаще 5 попыток в минуту с адреса (бэкенд дополнительно режет 5 за 15 минут)
limit_req_zone $binary_remote_addr zone=fc_login:10m rate=5r/m;
# Остальной API: защита от простого флуда
limit_req_zone $binary_remote_addr zone=fc_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.ru;

    ssl_certificate     /etc/letsencrypt/live/api.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fc_ssl:10m;

    server_tokens off;
    client_max_body_size 300k;   # бэкенд сам отклоняет всё больше 256 КБ
    client_body_timeout 10s;
    limit_req_status 429;

    access_log /var/log/nginx/flower-cup-api.access.log;
    error_log  /var/log/nginx/flower-cup-api.error.log warn;

    include snippets/flower-cup-security.conf;

    location = /api/admin/login {
        limit_req zone=fc_login burst=5 nodelay;
        include snippets/flower-cup-api-proxy.conf;
    }

    location /api/ {
        limit_req zone=fc_api burst=40 nodelay;
        include snippets/flower-cup-api-proxy.conf;
    }

    # Кроме /api/ здесь ничего нет
    location / {
        return 404;
    }
}
