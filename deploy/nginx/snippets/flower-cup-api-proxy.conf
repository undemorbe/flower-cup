# Проксирование на Node-бэкенд (server/index.js слушает только 127.0.0.1).
proxy_pass http://flower_cup_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Именно $remote_addr, а не $proxy_add_x_forwarded_for: бэкенд берёт первый адрес из заголовка,
# и клиент не должен иметь возможности подставить туда свой (обход лимита попыток входа).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 20s;
proxy_send_timeout 20s;
