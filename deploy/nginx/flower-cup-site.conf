# Вариант 2: всё на своём сервере - статика из dist/ и API на одном домене.
#   https://flowercup.example.ru/        сайт (собран с BASE_PATH=/)
#   https://flowercup.example.ru/api/    бэкенд
#
# Сборка:  BASE_PATH=/ VITE_SITE_URL=https://flowercup.example.ru VITE_API_URL=https://flowercup.example.ru \
#          VITE_ADMIN_PATH=/ваш-секретный-адрес npm run build
#          rsync -a --delete dist/ server:/var/www/flower-cup/
# В server/.env: TRUST_PROXY=1, ALLOWED_ORIGINS=https://flowercup.example.ru
# Установка - как в flower-cup-api.conf. Если оба файла включены одновременно,
# upstream и limit_req_zone оставьте только в одном из них.

upstream flower_cup_api {
    server 127.0.0.1:8787;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=fc_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=fc_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name flowercup.example.ru www.flowercup.example.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://flowercup.example.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flowercup.example.ru;

    ssl_certificate     /etc/letsencrypt/live/flowercup.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowercup.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fc_ssl:10m;

    root /var/www/flower-cup;
    index index.html;
    charset utf-8;

    server_tokens off;
    client_max_body_size 300k;
    client_body_timeout 10s;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    access_log /var/log/nginx/flower-cup.access.log;
    error_log  /var/log/nginx/flower-cup.error.log warn;

    include snippets/flower-cup-security.conf;

    # ---------- API ----------
    location = /api/admin/login {
        limit_req zone=fc_login burst=5 nodelay;
        include snippets/flower-cup-api-proxy.conf;
    }

    location /api/ {
        limit_req zone=fc_api burst=40 nodelay;
        include snippets/flower-cup-api-proxy.conf;
    }

    # ---------- статика ----------
    # Файлы с хешем в имени не меняются никогда
    location /assets/ {
        include snippets/flower-cup-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Служебное от сборки и скрытые файлы не отдаём
    location ~ /\. {
        return 404;
    }

    # Пререндеренные страницы лежат как /plants/bazilik/index.html.
    # Неизвестный адрес -> своя 404 со статусом 404; внутри неё стартует приложение и,
    # если раздел или QR-код появились в API уже после сборки, покажет их.
    location / {
        include snippets/flower-cup-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/flower-cup-security.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }
}
