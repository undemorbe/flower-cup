name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# По умолчанию токен только читает; права на публикацию есть лишь у job deploy
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions закреплены по SHA коммита: тег можно перевесить, SHA - нет
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Проектный сайт живёт по адресу https://<user>.github.io/<repo>/
          # Для user-site (<user>.github.io) или своего домена поставьте BASE_PATH: /
          BASE_PATH: /${{ github.event.repository.name }}/
          # Всё ниже необязательно: без переменных сайт собирается на встроенных (mock) данных.
          # Settings -> Secrets and variables -> Actions -> Variables:
          #   API_URL   https://api.example.ru  (бэкенд за nginx, см. deploy/nginx/flower-cup-api.conf)
          #   SITE_URL  свой домен, если есть (canonical, sitemap)
          VITE_API_URL: ${{ vars.API_URL }}
          CONTENT_API_URL: ${{ vars.API_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          # Secrets: ADMIN_PATH - адрес админки, например /kabinet-7f3k (иначе /studio-fc)
          VITE_ADMIN_PATH: ${{ secrets.ADMIN_PATH }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
